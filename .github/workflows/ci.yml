name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The transcription engine uses iOS 26 APIs (SpeechAnalyzer), so it needs a recent Xcode.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -20

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MURMUR.xcodeproj \
            -scheme MURMUR \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
